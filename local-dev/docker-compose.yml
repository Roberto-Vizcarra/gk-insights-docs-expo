name: gki-docs-local

# Local WordPress for testing the GKI Docs Helper plugin.
# See LOCAL-DEV.md in the repo root for the full runbook.
#
# Quick start:
#   cd local-dev
#   copy .env.example .env
#   docker compose up -d
#   http://localhost:8420

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=512M
      # MariaDB still defaults to latin1. WordPress content is utf8mb4 (curly
      # quotes, em dashes, emoji). Without this, multibyte characters import as
      # '?' - which both corrupts content and collides on unique keys.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # Drop a prod .sql dump here; it is visible inside the containers at /dump
      - ./db-dump:/dump
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:${WP_IMAGE_TAG:-6.8-php8.2-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
      # WP_DEBUG MUST be set through this env var, never in CONFIG_EXTRA below.
      # The image already writes its own define('WP_DEBUG', ...) into
      # wp-config.php; defining it a second time emits a PHP warning, and that
      # warning is output before headers - which silently breaks every redirect
      # and template on the site.
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        /* Pin the site to localhost no matter what the imported DB says. */
        define( 'WP_HOME',    'http://localhost:${WP_PORT:-8420}' );
        define( 'WP_SITEURL', 'http://localhost:${WP_PORT:-8420}' );

        /* Log everything; display nothing. Printing notices to the page breaks
           header() calls exactly the way the duplicate WP_DEBUG define did. */
        define( 'WP_DEBUG_LOG',      '/var/www/html/wp-content/debug.log' );
        define( 'WP_DEBUG_DISPLAY',  false );
        @ini_set( 'display_errors', 0 );
        define( 'SCRIPT_DEBUG',      true );
        define( 'SAVEQUERIES',       false );

        /* Never let a local copy phone home or email real people. */
        define( 'WP_ENVIRONMENT_TYPE',   'local' );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
        define( 'DISALLOW_FILE_EDIT',    false );
        define( 'WP_DISABLE_FATAL_ERROR_HANDLER', true );
    volumes:
      - wp_core:/var/www/html
      # Live-edit the plugin: no zip rebuild needed while iterating locally.
      - ../gki-docs-helper:/var/www/html/wp-content/plugins/gki-docs-helper
      # Prod uploads land here (optional; images 404 harmlessly if empty).
      - ./uploads:/var/www/html/wp-content/uploads
      - ./php.ini:/usr/local/etc/php/conf.d/zz-gki-local.ini:ro

  # One-shot WP-CLI runner. Not started by `up`.
  #   docker compose run --rm wpcli plugin list
  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
    volumes:
      - wp_core:/var/www/html
      - ../gki-docs-helper:/var/www/html/wp-content/plugins/gki-docs-helper
      - ./uploads:/var/www/html/wp-content/uploads
      - ./db-dump:/dump

  # Browse/repair the database directly. Not started by `up`.
  #   docker compose --profile tools up -d adminer   ->  http://localhost:8421
  adminer:
    image: adminer:latest
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
  wp_core:
