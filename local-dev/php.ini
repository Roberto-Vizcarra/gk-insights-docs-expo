; Local dev only. Generous limits so big plugin zips and migration
; archives import without tripping over upload caps.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
max_input_vars = 10000

; Log everything, display nothing.
;
; display_errors = On looks helpful but is actively harmful on WordPress: any
; notice printed before a header() call produces "headers already sent" and
; breaks redirects, canonical URLs, and template loading site-wide. Read
; wp-content/debug.log instead.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
